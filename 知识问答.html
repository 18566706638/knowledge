const startBtn = document.getElementById('start');
const submitBtn = document.getElementById('submit');
const nextBtn = document.getElementById('next');
const resetBtn = document.getElementById('reset');
const clearWrongBtn = document.getElementById('clearWrong');
const doWrongBtn = document.getElementById('doWrong');
const qnum = document.getElementById('qnum');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const answerBox = document.getElementById('answerBox');
const answerFull = document.getElementById('answerFull');
const doneEl = document.getElementById('done');
const rightEl = document.getElementById('right');
const wrongEl = document.getElementById('wrong');
const rateEl = document.getElementById('rate');
const wrongCountEl = document.getElementById('wrongCount');
const wrongListEl = document.getElementById('wrongList');

let current = -1;
let select = null;
let done = 0, right = 0, wrong = 0;
let used = [];
let wrongList = [];
let isWrongMode = false;

startBtn.onclick = () => { isWrongMode = false; nextOne() };
submitBtn.onclick = check;
nextBtn.onclick = () => isWrongMode ? wrongNext() : nextOne();
resetBtn.onclick = resetAll;
clearWrongBtn.onclick = clearWrong;
doWrongBtn.onclick = () => {
  if(wrongList.length === 0){ alert('暂无错题'); return; }
  isWrongMode = true; wrongNext();
};

function nextOne(){
  if(used.length >= 100){ alert('已刷完100题'); resetAll(); return; }
  do{ current = Math.floor(Math.random()*100); } while(used.includes(current));
  used.push(current);
  render();
}

function wrongNext(){
  current = wrongList[Math.floor(Math.random() * wrongList.length)];
  render();
}

function render(){
  select = null;
  submitBtn.disabled = false;
  nextBtn.disabled = true;
  answerBox.classList.add('hidden');
  qnum.innerText = isWrongMode ? `[错题重刷] 第${current+1}题` : `第${current+1}题`;
  questionEl.innerText = questions[current].q;
  optionsEl.innerHTML = '';
  let opts = questions[current].options;
  opts.forEach((o,i) => {
    let div = document.createElement('div');
    div.className = 'option';
    div.innerText = String.fromCharCode(65+i) + '. ' + o;
    div.onclick = () => {
      document.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      select = i;
    };
    optionsEl.appendChild(div);
  });
}

function check(){
  if(select === null) return;
  submitBtn.disabled = true;
  nextBtn.disabled = false;
  done++;
  let q = questions[current];
  let okIndex = q.options.indexOf(q.a);
  let all = document.querySelectorAll('.option');
  all.forEach((o,i) => {
    if(i === okIndex) o.classList.add('right');
    else if(i === select) o.classList.add('wrong');
    o.onclick = null;
  });
  answerFull.innerText = q.a;
  answerBox.classList.remove('hidden');
  if(select === okIndex){
    right++;
  }else{
    wrong++;
    if(!wrongList.includes(current)) wrongList.push(current);
  }
  update();
  showWrong();
}

function update(){
  doneEl.innerText = done;
  rightEl.innerText = right;
  wrongEl.innerText = wrong;
  rateEl.innerText = done ? Math.round(right/done*100)+'%' : '0%';
  wrongCountEl.innerText = wrongList.length;
}

function showWrong(){
  if(wrongList.length === 0){ wrongListEl.innerHTML = '暂无错题'; return; }
  wrongListEl.innerHTML = '';
  wrongList.forEach(idx => {
    let item = document.createElement('div');
    item.className = 'wrong-item';
    item.innerHTML = `
      <div class="wrong-q">${idx+1}、${questions[idx].q}</div>
      <div class="wrong-a">✅ ${questions[idx].a}</div>
    `;
    wrongListEl.appendChild(item);
  });
}

function clearWrong(){
  if(!confirm('确定清空错题本？')) return;
  wrongList = [];
  showWrong(); update();
}

function resetAll(){
  current = -1; select = null; done = 0; right = 0; wrong = 0;
  used = []; wrongList = []; isWrongMode = false;
  update(); showWrong();
  qnum.innerText = '请点击【随机一题】开始';
  questionEl.innerText = ''; optionsEl.innerHTML = '';
  answerBox.classList.add('hidden');
  submitBtn.disabled = true; nextBtn.disabled = true;
}
</script>
